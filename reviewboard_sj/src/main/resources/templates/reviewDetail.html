<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>회원 가입</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
	<div class="review-wrap">
	 	<h2>리뷰 상세보기</h2>
		<table class="detail-table">
		    <tr>
		        <th>제목</th>
		        <td th:text="${oneReview.title}"></td>
		    </tr>
		    <tr>
		        <th>작성자</th>
		        <td th:text="${oneReview.writer}"></td>
		    </tr>
		    <tr>
		        <th>조회수</th>
		        <td th:text="${oneReview.readCount}"></td>
		    </tr>
		    <tr>
		        <th>별점</th>
		        <td th:text="${oneReview.rate}"></td>
		    </tr>
		    <tr>
		        <th>내용</th>
		        <td th:text="${oneReview.content}"></td>
		    </tr>
		</table>
	 	<div class="detail-btn">
	 		<button class="list-btn" type="button" th:onclick="|location.href='@{/update(id=${oneReview.id})}'|">수정</button>
	 		<form th:action="@{/deletePro}" method="get" style="display:inline">
		 		<input type="hidden" name="id" th:value="${oneReview.id}">
		 		<input class="list-btn" type = "submit" value="삭제" onclick="return confirm('정말 삭제하시겠습니까?');">
	 		</form>
	 		<a th:href="@{/}" class="list-btn">취소</a>
	 	</div>
	</div>
</body>
</html>
