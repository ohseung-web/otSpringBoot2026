<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/review.css}">
</head>
<body>
	<div id="section_wrap">
			<div class="word">게시글 수정하기</div>
			<div class="content">
			<form th:action="@{/updatePro}" method="POST">
				<input type="hidden" name="num" th:value="${onereview.num}">
			   <table width="600" border="1">
			     <tbody>
			     	<tr height="40">
			     	    <td width="150" align="center">글번호</td>
			     		<td width="450" align="center" th:text="${onereview.num}"></td>
			     	</tr>
			     	<tr>
			     	    <td width="150" align="center">작성자</td>
			     		<td width="450" align="center" th:text="${onereview.writer}"></td>
			     	</tr>
			     	<tr height="40">
			     	    <td width="150" align="center">제목</td>
			     		<td>
			     			<input type="text" name="title" th:value="${onereview.title}"/>
			     		</td>
			     	</tr>
			     	<tr height="40">
			     	    <td width="150" align="center">별점</td>
			     		<td>
			     			<select name="star">
							    <option value="5" th:selected="${onereview.star == 5}">5점</option>
							    <option value="4" th:selected="${onereview.star == 4}">4점</option>
							    <option value="3" th:selected="${onereview.star == 3}">3점</option>
							    <option value="2" th:selected="${onereview.star == 2}">2점</option>
							    <option value="1" th:selected="${onereview.star == 1}">1점</option>
							</select>
			     		</td>
			     	</tr>
			     	<tr height="40">
			     	    <td width="150" align="center">내용</td>
			     		<td>
			     			<textarea name="content" th:text="${onereview.content}"></textarea>
			     		</td>
			     	</tr>
			     	<tr height="40">
			     		<td align="center" colspan="2">
			     			<input type="submit" value="수정완료"/>
			     			<input type="button" value="취소" th:onclick="|location.href='@{/detail(num=${onereview.num})}'|"/>
			     		</td>
			     	</tr>
			     </tbody>  	
			   </table>  
			</form>
			</div>
		</div>
</body>
</html>
